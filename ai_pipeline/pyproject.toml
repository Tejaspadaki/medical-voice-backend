[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_pipeline"
version = "0.1.0"
description = "ASR & Medical NER pipeline stub for Multilingual Medical Speech Transcription"
readme = "README.md"
authors = [{ name = "Medical Transcription Team" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "spacy>=3.5.0",
    "soundfile>=0.12.1"
]
